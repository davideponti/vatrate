name: Weekly EU VAT Scraper
on:
  schedule:
    # Every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scrape EU VAT rates
        run: node apps/data/scripts/scrape-eu.mjs
      - name: Validate
        run: node apps/data/scripts/validate.mjs
      - name: Create PR if changes
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: update EU VAT rates'
          title: 'Weekly VAT rates update'
          body: 'Automated weekly update of EU VAT rates from European Commission database.'
          branch: 'update/vat-rates'
          base: 'main'
